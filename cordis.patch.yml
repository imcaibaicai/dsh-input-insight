# Bundle patch layer: loads this package's main entry as the host half (a plain
# Cordis plugin). The `dsh.client` declaration in package.json makes the web app
# load ./lib/client.js as the browser half and seat its tab in the right sidebar.
#
# Remove this row (or the whole file reference) to unload; nothing else in DSH is
# touched. Config keys are all optional — the defaults resolve DSH_HOME through
# the harness's own `dshHomePath` service.
- insert:
    - id: input-insight
      name: 'dsh-input-insight'
